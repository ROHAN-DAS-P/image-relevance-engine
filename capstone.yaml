```yaml
run: "uvicorn main:app --host 0.0.0.0 --port 8000"
seed: "python seed_posts.py"
test: "pytest"
base_url: "http://127.0.0.1:8000"

endpoints:
  - method: GET
    path: "/health"

  - method: POST
    path: "/api/jobs/process-images"

  - method: POST
    path: "/api/matches/{match_id}/approve"

  - method: POST
    path: "/api/matches/{match_id}/reject"
```
